# Mechanical zero offsets (radians)
# -------------------------------------------------
# Positive values rotate CCW when viewed
# from the motor’s back (Dynamixel convention).
# Start with zeros; update after dial-in.

offsets:
  # -------------  LEFT ARM  -------------
  l1:  272        # left_shoulder_flexionextension
  l2:  310        # left_shoulder_abductionadduction
  l3:  130       # left_elbow_flexionextension
  l4:  95       # left_elbow_rotation


  # -------------  RIGHT ARM -------------
  r1:  48        # right_shoulder_flexionextension
  r2:  136       # right_shoulder_abductionadduction
  r3:  172       # right_elbow_flexionextension
  r4:  280      # right_elbow_rotation
